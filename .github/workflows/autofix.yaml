name: autofix.ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun environment
        uses: logica-oss/actions-toolkit/setup-bun@5c92317e3cd93cc23a2c8c25e82e23783b18f186 # v1.1.1
      - name: Lint
        run: bun run lint
      - name: Format
        run: bun run format
      - name: Sync Agent Config
        uses: logica-oss/actions-toolkit/sync-agent-config@5c92317e3cd93cc23a2c8c25e82e23783b18f186 # v1.1.1
      - name: Autofix Text
        uses: logica-oss/actions-toolkit/autofix-text@5c92317e3cd93cc23a2c8c25e82e23783b18f186 # v1.1.1
