name: autofix.ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: autofix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun environment
        uses: logica-oss/actions-toolkit/setup-bun@3caa6b132a2307a0dcbff102d1d1411a2be4107a # v1.0.1
      - name: Lint
        run: bun run lint
      - name: Format
        run: bun run format
      - name: Sync Agent Config
        uses: logica-oss/actions-toolkit/sync-agent-config@3caa6b132a2307a0dcbff102d1d1411a2be4107a # v1.0.1
      - name: Autofix Text
        uses: logica-oss/actions-toolkit/autofix-text@3caa6b132a2307a0dcbff102d1d1411a2be4107a # v1.0.1
