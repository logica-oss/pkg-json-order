name: Check (Release Label)

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize, reopened, ready_for_review]

concurrency:
  group: check-release-label-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  check-release-label:
    name: Check (Release Label)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check release label
        uses: logica-oss/actions-toolkit/check-release-label@7da75ca761d71af4d36eb1d1d33eb78d0c906a32 # v1.2.3
